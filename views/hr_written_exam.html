<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XBP Global - Skills Assessment</title>
    <script src="../tailwind.js"></script>
    <!-- <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet"> -->
    <script src="../sweetalert.js"></script>

<body class="min-h-screen flex flex-col items-center justify-center p-4 unselectable" oncontextmenu="return false;">

    <div id="setup-screen" class="glass-panel w-full max-w-md p-8 text-center animate-fade-in">
        <img src="../images/xbp-global.png" alt="XBP Global" class="h-12 mx-auto mb-6">
        <h2 class="text-2xl font-bold text-gray-800 mb-2">Pre-Employment Assessment</h2>
        
        <div class="bg-yellow-50 border border-yellow-200 p-3 rounded-lg text-xs text-yellow-700 text-left mb-6">
            <strong><i class="fas fa-shield-alt mr-1"></i> Security Notice:</strong>
            <ul class="list-disc pl-4 mt-1">
                <!-- <li>You have <strong>30 minutes</strong> to complete this exam.</li> -->
                <li>Do not switch tabs or open other windows. Doing so 3 times will result in an automatic failure.</li>
            </ul>
        </div>

        <div class="flex gap-4 mb-4">
            <input type="text" id="exam_fname" placeholder="First Name" class="w-1/2 p-3 border-2 border-blue-200 rounded-xl text-gray-700 font-semibold focus:border-blue-500 outline-none uppercase" required>
            <input type="text" id="exam_lname" placeholder="Last Name" class="w-1/2 p-3 border-2 border-blue-200 rounded-xl text-gray-700 font-semibold focus:border-blue-500 outline-none uppercase" required>
        </div>

        <select id="role-selector" class="w-full p-3 border-2 border-blue-200 rounded-xl text-gray-700 font-semibold focus:border-blue-500 focus:ring-0 transition mb-6">
            <option value="">- Select Position -</option>
        </select>

        <button id="start-exam-btn" class="w-full bg-blue-600 text-white font-bold py-3 rounded-xl hover:bg-blue-700 transition shadow-lg disabled:opacity-50">
            Start Exam
        </button>

        <button id="exempt-btn" class="mt-4 text-xs font-bold text-gray-400 hover:text-blue-600 transition">
            I have an exemption code
        </button>
    </div>

    <div id="exam-screen" class="hidden glass-panel w-full max-w-3xl overflow-hidden">
        
        <div class="bg-blue-600 px-6 py-4 flex justify-between items-center text-white">
            <span class="font-bold tracking-wide" id="progress-text">Question 1</span>
            <div class="flex items-center gap-2 bg-blue-800 px-3 py-1.5 rounded-lg font-mono font-bold shadow-inner">
                <i class="fas fa-stopwatch animate-pulse text-red-300"></i>
                <span id="timer-display">30:00</span>
            </div>
        </div>

        <div class="w-full bg-gray-200 h-1.5">
            <div id="progress-bar" class="bg-green-400 h-1.5 transition-all duration-500" style="width: 0%;"></div>
        </div>

        <div class="p-8">
            <h2 id="question-title" class="text-xl font-bold text-gray-800 mb-6 leading-relaxed">Loading question...</h2>
            <div id="options-container" class="space-y-3 flex flex-col">
            </div>

            <div class="mt-10 flex justify-between items-center border-t border-gray-100 pt-6">
                <button id="btn-prev" class="hidden px-6 py-2.5 rounded-xl border border-gray-300 text-gray-600 font-bold hover:bg-gray-100 shadow-sm transition">
                    <i class="fas fa-arrow-left mr-2"></i> Previous
                </button>

                <button id="btn-next" class="ml-auto px-8 py-2.5 rounded-xl bg-blue-600 text-white font-bold hover:bg-blue-700 shadow-md transition">
                    Next Question <i class="fas fa-arrow-right ml-2"></i>
                </button>

                <button id="btn-submit" class="hidden ml-auto px-8 py-2.5 rounded-xl bg-green-600 text-white font-bold hover:bg-green-700 shadow-md transition">
                    <i class="fas fa-check-double mr-2"></i> Submit Exam
                </button>
            </div>
        </div>
    </div>

    <script>
        // CORE VARIABLES
        let examQuestions = [];
        let currentQuestionIndex = 0;
        let userAnswers = [];
        let passingScore = 70;
        const API_URL = '../hr_dashboard_api.php';

        // TIMER & SECURITY VARIABLES
        let endTime; // Absolute time tracking
        let timerInterval;
        let cheatWarnings = 0;
        let examActive = false;
        let timeLimitMinutes = 30;

        // DOM ELEMENTS
        const setupScreen = document.getElementById('setup-screen');
        const examScreen = document.getElementById('exam-screen');
        const roleSelector = document.getElementById('role-selector');
        const startBtn = document.getElementById('start-exam-btn');
        const optionsContainer = document.getElementById('options-container');
        const btnPrev = document.getElementById('btn-prev');
        const btnNext = document.getElementById('btn-next');
        const btnSubmit = document.getElementById('btn-submit');

        window.zoomImage = function(url) {
            Swal.fire({
                imageUrl: url,
                imageAlt: 'Exam Visual',
                width: 'auto',
                padding: '1em',
                showConfirmButton: false,
                showCloseButton: true,
                background: 'rgba(255, 255, 255, 0.95)',
                backdrop: `rgba(0,0,0,0.85)`
            });
        }

        // --- EXEMPTION LOGIC ---
        document.getElementById('exempt-btn').addEventListener('click', () => {
            Swal.fire({
                title: 'Exemption Override',
                text: 'Enter the bypass code provided by HR:',
                input: 'password',
                showCancelButton: true,
                confirmButtonText: 'Verify Code',
                confirmButtonColor: '#3b82f6'
            }).then(result => {
                if (result.isConfirmed) {
                    if (result.value === 'XBP-EXEMPT') {
                        sessionStorage.setItem('r_ams_exam_passed', 'true');
                        sessionStorage.setItem('r_ams_exam_score', 'Exempt');
                        sessionStorage.setItem('r_ams_exam_history', JSON.stringify([]));
                        window.location.href = 'recruitment_userform.html';
                    } else {
                        Swal.fire('Access Denied', 'Invalid exemption code.', 'error');
                    }
                }
            });
        });

        // --- 1. LOAD CATEGORIES ---
        async function loadCategories() {
            try {
                const res = await fetch(`${API_URL}?action=getExamCategories`);
                const categories = await res.json();
                categories.forEach(cat => {
                    const option = document.createElement('option');
                    option.value = cat.id;
                    option.dataset.passing = cat.passing_score;
                    option.dataset.time = cat.time_limit_minutes; // <-- ADD THIS LINE
                    option.textContent = cat.category_name;
                    roleSelector.appendChild(option);
                });
            } catch (e) { console.error("API Error:", e); }
        }
        loadCategories();

        // --- 2. START EXAM ---
        startBtn.addEventListener('click', async () => {
            const fname = document.getElementById('exam_fname')?.value.trim();
            const lname = document.getElementById('exam_lname')?.value.trim();
            const categoryId = roleSelector.value;
            
            if(document.getElementById('exam_fname') && (!fname || !lname)) return Swal.fire('Required', 'Please enter your First and Last Name.', 'warning');
            if(!categoryId) return Swal.fire('Required', 'Please select a position.', 'warning');
            
            // --- GRAB THE DYNAMIC SCORES AND TIME ---
            const selectedOption = roleSelector.options[roleSelector.selectedIndex];
            passingScore = parseInt(selectedOption.dataset.passing) || 70;
            timeLimitMinutes = parseInt(selectedOption.dataset.time) || 30; 
            const roleName = selectedOption.textContent;

            // --- NEW: HR PASSWORD AUTHORIZATION ---
            // You can change this password to whatever your HR team prefers
            const HR_PASSWORD = "XBP-EXAM-2026"; 

            const { value: enteredPassword } = await Swal.fire({
                title: '<i class="fas fa-lock text-gray-700"></i> HR Authorization',
                html: '<span class="text-sm text-gray-500">Please ask the HR Administrator to enter the password to unlock this assessment.</span>',
                input: 'password',
                inputPlaceholder: 'Enter HR Password',
                inputAttributes: {
                    autocapitalize: 'off',
                    autocorrect: 'off'
                },
                showCancelButton: true,
                confirmButtonColor: '#3b82f6',
                cancelButtonColor: '#9ca3af',
                confirmButtonText: 'Unlock Exam'
            });

            // If they click cancel or click outside the box, stop here
            if (!enteredPassword) return;

            // If the password is wrong, kick them out
            if (enteredPassword !== HR_PASSWORD) {
                return Swal.fire('Access Denied', 'Incorrect authorization password.', 'error');
            }
            // ----------------------------------------

            // --- EXISTING: CONFIRMATION PROMPT ---
            Swal.fire({
                title: 'Ready to begin?',
                html: `You are about to start the assessment for <strong>${roleName}</strong>.<br><br>
                       ⏱️ You will have <strong>${timeLimitMinutes} minutes</strong> to complete the exam.<br><br>
                       <span class="text-xs text-red-500 font-bold"><i class="fas fa-exclamation-triangle"></i> Do not switch tabs or open other windows once the exam starts.</span>`,
                icon: 'info',
                showCancelButton: true,
                confirmButtonColor: '#3b82f6',
                cancelButtonColor: '#9ca3af',
                confirmButtonText: 'Yes, Start Now',
                cancelButtonText: 'Cancel'
            }).then(async (result) => {
                if (result.isConfirmed) {
                    
                    Swal.fire({ title: 'Preparing Exam...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });

                    try {
                        const res = await fetch(`${API_URL}?action=getApplicantExam&category_id=${categoryId}`);
                        examQuestions = await res.json();
                        
                        if(examQuestions.length === 0) throw new Error("No active questions available for this role.");
                        
                        userAnswers = new Array(examQuestions.length).fill(null);
                        
                        Swal.close();
                        setupScreen.classList.add('hidden');
                        examScreen.classList.remove('hidden');
                        
                        examActive = true;
                        
                        // Initialize Absolute Timer with Dynamic Time
                        endTime = Date.now() + (timeLimitMinutes * 60 * 1000); 
                        startTimer();
                        renderQuestion();
                        
                    } catch (e) {
                        Swal.fire('Error', e.message, 'error');
                    }
                }
            });
        });

        // --- 3. RENDER QUESTION ---
        function renderQuestion() {
            const q = examQuestions[currentQuestionIndex];
            
            // Check if there is an image to display
            let imageHTML = '';
            if (q.image_path) {
                imageHTML = `
                    <div class="relative inline-block w-full text-center group cursor-zoom-in" onclick="zoomImage('../${q.image_path}')">
                        <img src="../${q.image_path}" class="w-auto max-h-56 mx-auto mb-2 rounded-lg shadow-sm border border-gray-200 transition-transform transform group-hover:scale-[1.02]">
                        <p class="text-[11px] font-bold text-gray-400 uppercase tracking-widest mb-6 group-hover:text-blue-500 transition"><i class="fas fa-search-plus"></i> Click image to enlarge</p>
                    </div>
                `;
            }
            
            document.getElementById('question-title').innerHTML = `
                ${imageHTML}
                <span class="text-blue-600 mr-2">${currentQuestionIndex + 1}.</span> 
                ${q.question_text}
            `;
            
            optionsContainer.innerHTML = '';
            
            const optionsMap = { 'A': q.option_a, 'B': q.option_b, 'C': q.option_c, 'D': q.option_d };
            
            Object.keys(optionsMap).forEach(key => {
                const isChecked = userAnswers[currentQuestionIndex] === key ? 'checked' : '';
                
                // Added the A, B, C, D explicit labels here!
                optionsContainer.innerHTML += `
                    <label class="option-label flex items-center p-4 border-2 border-gray-200 rounded-xl cursor-pointer hover:bg-gray-50 transition">
                        <input type="radio" name="answer" value="${key}" class="w-5 h-5 text-blue-600 focus:ring-blue-500 border-gray-300" ${isChecked} onchange="userAnswers[${currentQuestionIndex}] = this.value">
                        <span class="ml-4 font-bold text-blue-600 w-6">${key})</span>
                        <span class="text-gray-700 font-medium flex-1">${optionsMap[key]}</span>
                    </label>
                `;
            });

            document.getElementById('progress-text').textContent = `Question ${currentQuestionIndex + 1} of ${examQuestions.length}`;
            document.getElementById('progress-bar').style.width = `${((currentQuestionIndex + 1) / examQuestions.length) * 100}%`;

            // Handle Buttons Visibility
            btnPrev.classList.toggle('hidden', currentQuestionIndex === 0);
            
            if (currentQuestionIndex === examQuestions.length - 1) {
                btnNext.classList.add('hidden');
                btnSubmit.classList.remove('hidden');
            } else {
                btnNext.classList.remove('hidden');
                btnSubmit.classList.add('hidden');
            }
        }

        // --- 4. NAVIGATION ---
        btnNext.addEventListener('click', () => {
            currentQuestionIndex++;
            renderQuestion();
        });

        btnPrev.addEventListener('click', () => {
            currentQuestionIndex--;
            renderQuestion();
        });

        btnSubmit.addEventListener('click', () => {
            // Check for unanswered questions
            const unanswered = userAnswers.filter(a => a === null).length;
            if (unanswered > 0) {
                Swal.fire({
                    title: 'Incomplete',
                    text: `You have ${unanswered} unanswered question(s). Are you sure you want to submit?`,
                    icon: 'warning',
                    showCancelButton: true,
                    confirmButtonText: 'Yes, Submit',
                    confirmButtonColor: '#10b981'
                }).then(res => { if (res.isConfirmed) processExam(false); });
            } else {
                processExam(false);
            }
        });

        // --- 5. ABSOLUTE TIMER ---
        function startTimer() {
            timerInterval = setInterval(() => {
                // Calculate remaining seconds based on real time
                let remainingSeconds = Math.round((endTime - Date.now()) / 1000);
                
                if (remainingSeconds <= 0) {
                    clearInterval(timerInterval);
                    processExam(true, 'Time is up! Your exam has been automatically submitted.');
                } else {
                    let m = Math.floor(remainingSeconds / 60);
                    let s = remainingSeconds % 60;
                    document.getElementById('timer-display').textContent = `${m}:${s < 10 ? '0' : ''}${s}`;
                    
                    if (remainingSeconds < 60) {
                        document.getElementById('timer-display').classList.add('text-red-400');
                    }
                }
            }, 1000);
        }

        // --- 6. ANTI-CHEAT SYSTEM (Tab Tracking) ---
        document.addEventListener('visibilitychange', () => {
            if (document.hidden && examActive) {
                cheatWarnings++;
                if (cheatWarnings >= 3) {
                    // Force Termination
                    processExam(true, 'Exam terminated due to multiple tab switching violations.');
                } else {
                    Swal.fire({
                        icon: 'warning',
                        title: 'Warning!',
                        text: `Please do not leave the exam tab. This is warning ${cheatWarnings} of 3.`,
                        confirmButtonColor: '#ef4444'
                    });
                }
            }
        });

        // --- 7. PROCESS & SCORE ---
        function processExam(forceFail = false, forceMessage = null) {
            clearInterval(timerInterval);
            examActive = false;
            let correct = 0;
            let examHistory = [];
            
            userAnswers.forEach((ans, index) => {
                let q = examQuestions[index];
                if (ans === q.correct_option) correct++;
                
                examHistory.push({
                    question: q.question_text,
                    options: { A: q.option_a, B: q.option_b, C: q.option_c, D: q.option_d },
                    user_answer: ans,
                    correct_answer: q.correct_option
                });
            });
            
            let percentage = Math.round((correct / examQuestions.length) * 100);
            let formattedScore = `${correct}/${examQuestions.length} ${percentage}%`;
            let isPass = (!forceFail && percentage >= passingScore);

            // Build Payload for DB Log
            const payload = {
                first_name: document.getElementById('exam_fname').value.trim().toUpperCase(),
                last_name: document.getElementById('exam_lname').value.trim().toUpperCase(),
                role_applied: roleSelector.options[roleSelector.selectedIndex].text,
                score_percentage: percentage,
                status: isPass ? 'Passed' : 'Failed',
                exam_data: JSON.stringify(examHistory)
            };

            Swal.fire({ title: 'Saving Results...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });

            // 1. Save to Database Log (Even if they failed or cheated!)
            fetch(`${API_URL}?action=saveExamAttempt`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            })
            .then(async (response) => {
                const rawText = await response.text(); // Get raw text to catch PHP crashes
                let data;
                
                try {
                    data = JSON.parse(rawText);
                } catch (e) {
                    console.error("PHP Error:", rawText);
                    Swal.fire({
                        icon: 'error',
                        title: 'Server Error',
                        html: `PHP crashed. Here is the exact error:<br><textarea class="w-full mt-3 p-2 text-xs border border-red-300 rounded h-32 text-red-600" readonly>${rawText}</textarea>`,
                        allowOutsideClick: false
                    });
                    return; // Stop the redirect so you can read the error!
                }

                if (data.status === 'error') {
                    Swal.fire('Database Error', data.message, 'error');
                    return; // Stop the redirect
                }

                // 2. Redirect Logic (Only runs if save was successful)
                if (isPass) {
                    sessionStorage.setItem('r_ams_exam_passed', 'true');
                    sessionStorage.setItem('r_ams_exam_score', formattedScore);
                    sessionStorage.setItem('r_ams_exam_history', JSON.stringify(examHistory));

                    Swal.fire({
                        icon: 'success', title: 'Exam Passed!', text: `Score: ${percentage}%. Routing to application form...`,
                        confirmButtonText: 'Proceed', allowOutsideClick: false
                    }).then(() => window.location.href = 'recruitment_userform.html'); 
                } else {
                    sessionStorage.removeItem('r_ams_exam_passed');
                    sessionStorage.removeItem('r_ams_exam_history');
                    
                    const msg = forceMessage || `Your score: ${percentage}%. Required: ${passingScore}%. Thank you for your interest.`;
                    Swal.fire({
                        icon: 'error', title: 'Exam Failed', text: msg,
                        confirmButtonText: 'Close', allowOutsideClick: false
                    }).then(() => window.location.href = '../views/hr_written_exam.html');
                }
            })
            .catch(err => {
                console.error("Network Error:", err);
                Swal.fire('Network Error', 'Failed to communicate with server. Check your connection.', 'error');
            });
        }
    </script>
</body>
</html>
