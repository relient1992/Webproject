<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>BPS Dashboard</title>
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
        
        <script type="text/javascript" src="https://cdn.jsdelivr.net/jquery/latest/jquery.min.js"></script>
        <script type="text/javascript" src="https://cdn.jsdelivr.net/momentjs/latest/moment.min.js"></script>
        <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/daterangepicker/daterangepicker.min.js"></script>
        <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/daterangepicker/daterangepicker.css" />
    
        <link rel="stylesheet" href="../bps_dashboard.css">
    </head>
<body>

    <div class="dashboard-wrapper">
        <header class="header">
            <div class="header-left">
                <span>BPS Overall Dashboard</span>
            </div>
            <div class="header-center">
                <nav>
                    <a href="#" class="active">BPS Overall Dashboard</a>
                    <a href="#">Project and Operator Efficiency</a>
                    <a href="#">BFP Data</a>
                    <a href="#">Operator Scorecard</a>
                </nav>
            </div>
            <div class="header-right">
                <i class="fas fa-bell"></i>
                <i class="fas fa-user-circle"></i>
            </div>
        </header>
        
        <main class="main-content">
            <div class="controls-bar">
                <div class="left-controls">
                    <button class="control-btn"><i class="fas fa-filter"></i> Filters</button>
                    <div class="date-range">
                        <i class="fas fa-calendar-alt"></i>
                        <input type="text" id="date-range-picker" readonly>
                    </div>
                    <div class="pillbox-container">
                        <span class="pill">Agents <i class="fas fa-times"></i></span>
                        <input type="text" placeholder="20 sec">
                    </div>
                </div>
                <div class="right-controls">
                    <button class="control-btn"><i class="fas fa-columns"></i> Columns</button>
                    <button class="control-btn"><i class="fas fa-file-csv"></i> CSV</button>
                    <button class="control-btn"><i class="fas fa-file-excel"></i> XLSX</button>
                </div>
            </div>

            <div class="filter-panel" id="filter-panel">
                <div class="filter-group">
                    <label for="filter-site">Site</label>
                    <select id="filter-site">
                        <option value="">All</option>
                        <option value="site-a">Site A</option>
                        <option value="site-b">Site B</option>
                        <option value="site-c">Site C</option>
                    </select>
                </div>
                <div class="filter-group">
                    <label for="filter-tl">Team Leader</label>
                    <select id="filter-tl">
                        <option value="">All</option>
                        <option value="tl-smith">Jane Smith</option>
                        <option value="tl-jones">John Jones</option>
                        <option value="tl-williams">Sarah Williams</option>
                    </select>
                </div>
                <div class="filter-group">
                    <label for="filter-projects">Projects</label>
                    <select id="filter-projects">
                        <option value="">All</option>
                        <option value="project-x">Project X</option>
                        <option value="project-y">Project Y</option>
                        <option value="project-z">Project Z</option>
                    </select>
                </div>
                <div class="filter-actions">
                    <button class="apply-filters-btn">Apply Filters</button>
                    <button class="clear-filters-btn">Clear All</button>
                </div>
            </div>


            <div class="table-container">
                <table class="data-table">
                    <thead>
                        <tr>
                            <th data-sort-by="eds">EDS <i class="fas fa-sort-down"></i></th>
                            <th data-sort-by="employee">EMPLOYEE <i class="fas fa-sort"></i></th>
                            <th data-sort-by="tl-name">TL NAME <i class="fas fa-sort"></i></th>
                            <th data-sort-by="records">RECORDS <i class="fas fa-sort"></i></th>
                            <th data-sort-by="hours">HOURS<i class="fas fa-sort"></i></th>
                            <th data-sort-by="shipment">SHIPMENT<i class="fas fa-sort"></i></th>
                            <th data-sort-by="alloc-eds">ALLOC EDS<i class="fas fa-sort"></i></th>
                            <th data-sort-by="tputs">TPUTS<i class="fas fa-sort"></i></th>
                            <th data-sort-by="vph">VPH <i class="fas fa-sort"></i></th>
                            <th data-sort-by="utilization">UTILIZATION<i class="fas fa-sort"></i></th>
                            <th data-sort-by="prod-ks-tputs">PROD_KS_TPUTS<i class="fas fa-sort"></i></th>
                            <th data-sort-by="payroll-ks-tputs">PAYROLL_KS_TPUTS<i class="fas fa-sort"></i></th>
                        </tr>
                    </thead>
                    <tbody>
                        </tbody>
                </table>
            </div>

            <div class="table-footer">
                <div class="footer-left">
                    <i class="fas fa-chevron-left"></i>
                    <span>1</span>
                    <i class="fas fa-chevron-right"></i>
                    <span class="entry-info">1,342 entries on 45 pages</span>
                </div>
                <div class="footer-right">
                    <span class="rows-label">Rows</span>
                    <select name="rows" id="rows-per-page">
                        <option value="10">10</option>
                        <option value="30" selected>30</option>
                        <option value="50">50</option>
                    </select>
                </div>
            </div>
        </main>
    </div>

    <script src="../js/bps_dashboard.js"></script>
</body>
</html>
