<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analytics Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/jquery/dist/jquery.min.js"></script>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/moment/min/moment.min.js"></script>
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/daterangepicker/daterangepicker.css" />
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/daterangepicker/daterangepicker.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
    <link rel="stylesheet" href="../bps_dashboard.css">
</head>
<body>

    <div class="dashboard-container">
        <header class="dashboard-header">
            <h1>Dashboard</h1>
            <div class="header-actions">
                </div>
        </header>

        <div class="filter-bar">
            <div class="filter-group">
                <div class="filter-item date-picker-container">
                    <label>Date Range</label>
                    <div id="reportrange">
                        <i class="fa fa-calendar"></i>&nbsp;
                        <span></span> <i class="fa fa-caret-down"></i>
                    </div>
                </div>

                <div class="filter-item multi-select-container">
                    <button id="project-filter-btn" class="filter-button">Projects</button>
                    <div id="project-filter-dropdown" class="filter-dropdown hidden">
                        <div class="filter-dropdown-header">Filter by Project</div>
                        <div class="filter-options">
                            <label><input type="checkbox" name="project" value="FedEx"> FedEx</label>
                            <label><input type="checkbox" name="project" value="Admin"> Admin</label>
                            <label><input type="checkbox" name="project" value="FedEx - BC Staff"> FedEx - BC Staff</label>
                            <label><input type="checkbox" name="project" value="LHI"> LHI</label>
                            <label><input type="checkbox" name="project" value="BPS"> BPS</label>
                        </div>
                        <div class="filter-dropdown-footer">
                            <button id="apply-project-filter" class="apply-btn">Apply</button>
                        </div>
                    </div>
                </div>
            </div>

            <div class="selected-filters-container">
                <div id="selected-filters" class="selected-filters">
                    </div>
                <button id="clear-all-filters" class="clear-all-btn hidden">Clear All</button>
            </div>
        </div>

        <div class="kpi-grid">
            <div class="kpi-card">
                <h4>Active Employees</h4>
                <p>1,234</p>
            </div>
            <div class="kpi-card">
                <h4>Inactive (YTD)</h4>
                <p>56</p>
            </div>
            <div class="kpi-card">
                <h4>New Hires (YTD)</h4>
                <p>128</p>
            </div>
            <div class="kpi-card">
                <h4>Efficiency</h4>
                <p>98.7%</p>
            </div>
        </div>

        <div class="main-chart-container">
            <h3>Performance Over Time</h3>
            <div class="chart-placeholder">
                <p>Chart Area</p>
            </div>
        </div>

        <div class="data-table-container">
            <h3>Detailed Summary</h3>
            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>Project</th>
                            <th>Employee Count</th>
                            <th>Site</th>
                            <th>Efficiency</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td>FedEx</td>
                            <td>19</td>
                            <td>CLARK</td>
                            <td>102%</td>
                        </tr>
                        <tr>
                            <td>Admin</td>
                            <td>76</td>
                            <td>SUBIC</td>
                            <td>99%</td>
                        </tr>
                        </tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script src="../js/dashboard.js"></script>
</body>
</html>
