<div class="team-member-view animate-fade-in p-4 w-full">
    
    <div class="mb-8">
        <h1 class="text-3xl font-extrabold tracking-tight text-slate-900 dark:text-white flex items-center gap-3">
            <span class="w-2 h-8 bg-indigo-600 rounded-full inline-block"></span>
            Team Roster
        </h1>
        <p class="text-slate-500 dark:text-slate-400 mt-1 ml-5 text-sm font-medium">Manage and view employee distributions by supervisor.</p>
    </div>

    <div class="bg-white/80 dark:bg-slate-900/80 backdrop-blur-xl rounded-2xl shadow-sm border border-slate-200/60 dark:border-slate-700/60 p-5 mb-8 flex flex-wrap items-end justify-between gap-4 relative z-10">
        
        <div class="flex flex-col flex-1 min-w-[280px] max-w-md group">
            <label for="teamSelect" class="text-[11px] font-bold text-slate-400 dark:text-slate-500 mb-1.5 uppercase tracking-widest ml-1">Select Supervisor</label>
            <div class="relative flex items-center">
                <span class="material-icons-sharp absolute left-3 text-slate-400 group-focus-within:text-indigo-600 transition-colors z-10 pointer-events-none">badge</span>
                <select id="teamSelect" class="w-full pl-10 pr-10 py-2.5 bg-slate-50 dark:bg-slate-800/50 border border-slate-200 dark:border-slate-700 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500/50 focus:border-indigo-500 dark:text-white text-sm font-medium appearance-none cursor-pointer transition-all">
                    <option value="">-- Select Supervisor --</option>
                </select>
                <span class="material-icons-sharp absolute right-3 text-slate-400 pointer-events-none z-10">expand_more</span>
            </div>
        </div>

        <div class="export-buttons-container flex items-center gap-3">
            </div>
    </div>

    <div class="bg-white dark:bg-slate-900 rounded-3xl shadow-[0_8px_30px_rgb(0,0,0,0.04)] border border-slate-200/50 dark:border-slate-800 overflow-hidden">
        <div class="overflow-x-auto">
            <table id="team-table" class="w-full text-left border-collapse min-w-max">
                <thead>
                    <tr class="bg-slate-50/50 dark:bg-slate-800/30 border-b border-slate-200 dark:border-slate-700/50">
                        <th class="px-6 py-4 text-[10px] font-bold text-slate-400 uppercase tracking-widest dark:text-slate-500">EDS</th>
                        <th class="px-6 py-4 text-[10px] font-bold text-slate-400 uppercase tracking-widest dark:text-slate-500">Fullname</th>
                        <th class="px-6 py-4 text-[10px] font-bold text-slate-400 uppercase tracking-widest dark:text-slate-500">Project</th>
                        <th class="px-6 py-4 text-[10px] font-bold text-slate-400 uppercase tracking-widest dark:text-slate-500">Position</th>
                        <th class="px-6 py-4 text-[10px] font-bold text-slate-400 uppercase tracking-widest dark:text-slate-500">Site</th>
                        <th class="px-6 py-4 text-[10px] font-bold text-slate-400 uppercase tracking-widest dark:text-slate-500">Supervisor</th>
                        <th class="px-6 py-4 text-[10px] font-bold text-slate-400 uppercase tracking-widest dark:text-slate-500">Status</th>
                        <th class="px-6 py-4 text-[10px] font-bold text-slate-400 uppercase tracking-widest dark:text-slate-500">Hired Date</th>
                    </tr>
                </thead>
                <tbody class="divide-y divide-slate-100 dark:divide-slate-800/50">
                    </tbody>
            </table>
        </div>
        
        <div id="team-empty-state" class="hidden py-20 flex flex-col items-center justify-center text-slate-400 dark:text-slate-600">
            <span class="material-icons-sharp text-5xl mb-4">search_off</span>
            <p class="font-bold italic tracking-wide">Select a supervisor to view team members</p>
        </div>
    </div>
</div>
